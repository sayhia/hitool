# Release — 自动构建发布
#
# 触发条件：推送 v* 标签（如 v1.0.0）→ 打 tag 即自动发布
#
# 职责：
#   1. 五平台矩阵构建（Linux amd64/arm64、macOS arm64/amd64、Windows amd64）
#   2. 完全复用项目 Taskfile + wails3 CLI 的打包链路（与本地 `task package` 行为一致）：
#        - Linux   → AppImage + deb + rpm
#        - macOS   → .app bundle（adhoc 签名）+ zip
#        - Windows → 可执行文件 + NSIS 安装包
#   3. 版本号从 tag 自动注入（config.yml / nfpm / Info.plist / NSIS）
#   4. 汇总发布到 GitHub Release（自动生成 release notes）
#
# 前置条件：
#   - Go 1.25+ / Node 22+（runner 自带，setup 步骤安装）
#   - wails3 CLI 与 task CLI 由 go install 安装；wails3 使用最新版（WAILS_VERSION）
#   - Linux 需要 GTK/WebKit 开发库（已 apt 安装，CGO 编译 GUI 后端）
#   - Windows 需要 NSIS（choco 安装）；SQLite 为纯 Go 驱动，无需 mingw/CGO
#   - Linux AppImage 需要 FUSE（已通过 APPIMAGE_EXTRACT_AND_RUN=1 规避，无需额外依赖）
#   - macOS 产物为 adhoc 签名；如需公证/正式签名，请配置 Apple 证书 secrets 并补充对应步骤
#
# 注意：darwin-amd64 使用 macos-15-intel（Intel x64 runner，macos-13 已弃用、排队过长）。
#       若 GitHub 下线 Intel 镜像，可移除该矩阵项或改用交叉编译。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  # wails3 CLI 最新版（2026-08-27 发布）。与 go.mod 中的库版本解耦；
  # 若后续打包命令出现兼容问题，可改回 go.mod 中的库版本
  WAILS_VERSION: v3.0.0-beta.15

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            package: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            package: linux
          - name: darwin-arm64
            os: macos-14
            package: darwin
          - name: darwin-amd64
            os: macos-15-intel
            package: darwin
          - name: windows-amd64
            os: windows-latest
            package: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux 需要两套 GTK/WebKit 开发库：
      #   - gtk4 + webkitgtk-6.0：wails3 CLI 自身编译（internal/operatingsystem 经 pkg-config 链接）
      #   - gtk3 + webkit2gtk-4.1：项目 go.mod 的 Wails 库版本编译 GUI 后端
      - name: Install WebKit/GTK dev packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev

      # Windows：NSIS（安装包）。SQLite 为纯 Go 驱动，不需要 mingw/CGO
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

      # 安装 task + wails3 CLI（与本地开发工具链一致）
      - name: Install task & wails3 CLI
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 将 tag 版本（去掉 v 前缀）注入各打包配置文件
      - name: Inject version from tag
        shell: bash
        run: bash .github/scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 复用项目 Taskfile 打包（内部含：bindings 生成 → 前端构建 → go build → 平台打包）
      # Linux 拆分为 build + deb/rpm/AppImage，跳过 aur（如需可追加 task linux:create:aur）
      # macOS 打包 .app 并生成 .dmg（hdiutil，拖入 Applications 安装）
      - name: Package (${{ matrix.package }})
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # VERSION 注入 Go 二进制（-X hitool/services.Version），用于应用内版本展示与更新检查
          V="VERSION=${GITHUB_REF_NAME#v}"
          case "${{ matrix.package }}" in
            linux)
              task linux:build "$V"
              task linux:create:deb "$V"
              task linux:create:rpm "$V"
              task linux:create:appimage "$V"
              ;;
            darwin)
              task darwin:package:dmg "$V"
              ;;
            windows)
              task windows:package "$V"
              ;;
          esac

      # 统一收集产物到 dist/release/（重命名带平台与版本号）
      - name: Collect artifacts
        shell: bash
        run: bash .github/scripts/collect-artifacts.sh "${{ matrix.name }}" "${GITHUB_REF_NAME#v}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.name }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
